<div class="container mt-4">
  <h2>Create Machine</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-3">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input
        formControlName="name"
        class="form-control"
        [ngClass]="{ 'is-invalid': f['name'].touched && f['name'].invalid }"
      />
      <div
        class="invalid-feedback"
        *ngIf="f['name'].touched && f['name'].errors?.['required']"
      >
        Name is required.
      </div>
      <div
        class="invalid-feedback"
        *ngIf="f['name'].touched && f['name'].errors?.['minlength']"
      >
        Minimum 3 characters.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">CEP</label>
      <input
        formControlName="cep"
        class="form-control"
        placeholder="00000-000"
        (blur)="onCepBlur()"
        [ngClass]="{ 'is-invalid': f['cep'].touched && f['cep'].invalid }"
      />
      <div
        class="invalid-feedback"
        *ngIf="f['cep'].touched && f['cep'].errors?.['required']"
      >
        CEP is required.
      </div>
      <div
        class="invalid-feedback"
        *ngIf="f['cep'].touched && f['cep'].errors?.['pattern']"
      >
        Invalid CEP format.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Location (auto-filled)</label>
      <input
        formControlName="location"
        class="form-control"
        readonly
        placeholder="Location will be auto-filled"
        [ngClass]="{
          'is-invalid': f['location'].touched && f['location'].invalid
        }"
      />
      <div
        class="invalid-feedback"
        *ngIf="f['location'].touched && f['location'].errors?.['required']"
      >
        Location is required (fill CEP correctly).
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Latitude (auto-filled)</label>
        <input
          formControlName="latitude"
          type="number"
          class="form-control"
          readonly
          placeholder="Latitude will be auto-filled"
          [ngClass]="{
            'is-invalid': f['latitude'].touched && f['latitude'].invalid
          }"
        />
        <div
          class="invalid-feedback"
          *ngIf="f['latitude'].touched && f['latitude'].errors?.['required']"
        >
          Latitude is required.
        </div>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Longitude (auto-filled)</label>
        <input
          formControlName="longitude"
          type="number"
          class="form-control"
          readonly
          placeholder="Longitude will be auto-filled"
          [ngClass]="{
            'is-invalid': f['longitude'].touched && f['longitude'].invalid
          }"
        />
        <div
          class="invalid-feedback"
          *ngIf="f['longitude'].touched && f['longitude'].errors?.['required']"
        >
          Longitude is required.
        </div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Status</label>
      <select formControlName="status" class="form-select">
        <option value="operating">Operating</option>
        <option value="maintenance">Maintenance</option>
        <option value="offline">Offline</option>
      </select>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <button
      class="btn btn-success"
      type="submit"
      [disabled]="form.invalid || loading"
    >
      {{ loading ? "Saving..." : "Save" }}
    </button>
    <a routerLink="/machines" class="btn btn-secondary ms-2">Cancel</a>
  </form>
</div>
